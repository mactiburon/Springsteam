spring.application.name=springbootdemo

spring.config.import=optional:file:.env[.properties],optional:file:springbootdemo/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (HS256). En produccion define JWT_SECRET en .env con >= 32 caracteres.
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-cambiar-antes-de-produccion}
app.jwt.expiration=${JWT_EXPIRATION:86400}