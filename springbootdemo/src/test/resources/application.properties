spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# JWT (HS256). Valor de desarrollo, igual que application.properties.
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-cambiar-antes-de-produccion}
app.jwt.expiration=${JWT_EXPIRATION:86400}