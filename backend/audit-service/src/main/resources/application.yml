spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5433/auditdb}
    username: ${AUDIT_DB_USERNAME:postgres}
    password: ${AUDIT_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-cambiar-antes-de-produccion}
  events:
    enabled: ${EVENTS_ENABLED:true}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info